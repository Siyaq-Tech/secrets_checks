name: Configuration Validation
# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow — validates GitHub Secrets and Variables
#
# HOW IT WORKS:
#   1. Checks out the calling repository
#   2. Reads .env_example  → extracts required variable names
#   3. Reads production YAML → extracts secrets.* and vars.* references
#   4. Calls the GitHub API to list configured secrets and variables
#   5. Cross-references the two files and reports what is present/missing
#   6. Fails if required configuration is missing (when fail-on-missing: true)
#
# USAGE — add this file to any repo as .github/workflows/validate-configuration.yml:
#
#   name: Configuration Validation
#
#   on:
#     push:
#       branches: [main]          # ← configure your target branch here
#     workflow_dispatch:
#
#   jobs:
#     validate:
#       uses: org_name/checks/.github/workflows/configuration-validation.yml@main
#       secrets: inherit
#       permissions:
#         contents: read
#       with:
#         environment: production
#         # Override defaults only when your repo uses a non-standard layout:
#         # env-example-path: '.env_example'
#         # prod-yml-paths: 'docker-compose.prod.yml,.github/workflows/deploy.yml'
#         # fail-on-missing: true
#
# EXTENDING:
#   Add new jobs below validate-configuration. They run in parallel.
#   Keep each job focused on a single concern. See the comment at the bottom.
# ─────────────────────────────────────────────────────────────────────────────


# ── BRANCH CONFIGURATION ──────────────────────────────────────────────────────
# Change the branch below to control when this workflow runs.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      env-example-path:
        type: string
        default: '.env_example'
      prod-yml-paths:
        type: string
        default: 'docker-compose.yml,docker-compose.prod.yml,docker-compose.production.yml,deployment.yaml,values-prod.yaml,.github/workflows/deploy.yml'
      fail-on-missing:
        type: boolean
        default: true
      environment:
        type: string
        default: 'production'
      gcp-project-id:
        type: string
        default: ''
      gcp-workload-identity-provider:
        type: string
        default: ''
      gcp-service-account:
        type: string
        default: ''
      gcp-secret-name:
        type: string
        default: ''
      gcp-secret-version:
        type: string
        default: 'latest'

jobs:
  validate-configuration:
    name: Configuration (production)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets and variables
        id: validate
        env:
          ENV_EXAMPLE_PATH: ${{ inputs.env-example-path }}
          PROD_YML_PATHS:   ${{ inputs.prod-yml-paths }}
          FAIL_ON_MISSING:  ${{ inputs.fail-on-missing }}
          ENVIRONMENT:      ${{ inputs.environment }}
        
        run: |
          set -euo pipefail
           # ── Capture everything this step prints, so the next step can
          #    post the exact same report to Zoho Cliq. TEE_PID is waited
          #    on at the very end so the file is never truncated.
          REPORT_FILE="${RUNNER_TEMP}/validation-report.txt"
          exec > >(tee "${REPORT_FILE}") 2>&1
          TEE_PID=$!

          FAILED=false
          REPO="${GITHUB_REPOSITORY}"
          ORG="${REPO%%/*}"
          HR='────────────────────────────────────────────────────────────────'

          pass()    { echo "  ✓ $*"; }
          fail()    { echo "  ✗ $*"; FAILED=true; }
          warn()    { echo "  ⚠  $*"; }
          info()    { echo "  $*"; }
          section() { echo; echo "  ── $1"; }
          dedup()   { [[ $# -gt 0 ]] && printf '%s\n' "$@" | sort -u || true; }
          contains() {
            local target="$1"; shift
            local item
            for item; do [[ "${item}" == "${target}" ]] && return 0; done
            return 1
          }

          echo "${HR}"
          info "Configuration Validation — ${ENVIRONMENT}"
          info "Repository : ${REPO}"
          info "Branch     : ${GITHUB_REF_NAME:-unknown}"
          echo "${HR}"

          # ── Locate .env_example ─────────────────────────────────────────────
          ENV_FILE=""
          for candidate in "${ENV_EXAMPLE_PATH}" ".env.example"; do
            [[ -f "${candidate}" ]] && { ENV_FILE="${candidate}"; break; }
          done

          # ── Locate ALL matching production config files ──────────────────────
          PROD_YMLS=()
          IFS=',' read -ra YML_CANDIDATES <<< "${PROD_YML_PATHS}"
          for raw in "${YML_CANDIDATES[@]}"; do
            path="${raw//[[:space:]]/}"
            [[ -n "${path}" && -f "${path}" ]] && PROD_YMLS+=("${path}")
          done

          section "Source files"
          [[ -n "${ENV_FILE}" ]] && info ".env_example : ${ENV_FILE}" \
                                 || warn "No .env_example found"
          if [[ ${#PROD_YMLS[@]} -gt 0 ]]; then
            for yml in "${PROD_YMLS[@]}"; do info "Production   : ${yml}"; done
          else
            warn "No production config found"
          fi

          # ── Parse .env_example ──────────────────────────────────────────────
          ENV_VARS=()
          if [[ -n "${ENV_FILE}" ]]; then
            while IFS= read -r name; do
              [[ -n "${name}" ]] && ENV_VARS+=("${name}")
            done < <(
              grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "${ENV_FILE}" \
                | sed 's/=.*//' | sort -u
            )
          fi

          # ── Parse ALL production files ──────────────────────────────────────
          RAW_SECRETS=(); RAW_VARS=(); RAW_COMPOSE=()

          for prod_file in "${PROD_YMLS[@]}"; do
            normalized=$(tr '\n' ' ' < "${prod_file}")

            while IFS= read -r name; do
              [[ -n "${name}" ]] && RAW_SECRETS+=("${name}")
            done < <(
              echo "${normalized}" \
                | grep -hoE '\$\{\{[[:space:]]*secrets\.[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\}\}' \
                     2>/dev/null \
                | sed -E 's/.*secrets\.([A-Za-z_][A-Za-z0-9_]*).*/\1/' || true
            )

            while IFS= read -r name; do
              [[ -n "${name}" ]] && RAW_VARS+=("${name}")
            done < <(
              echo "${normalized}" \
                | grep -hoE '\$\{\{[[:space:]]*vars\.[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\}\}' \
                     2>/dev/null \
                | sed -E 's/.*vars\.([A-Za-z_][A-Za-z0-9_]*).*/\1/' || true
            )

            while IFS= read -r name; do
              [[ -n "${name}" ]] && RAW_COMPOSE+=("${name}")
            done < <(
              echo "${normalized}" \
                | grep -hoE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' 2>/dev/null \
                | sed -E 's/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/\1/' || true
            )
          done

          SECRETS_IN_YAML=(); VARS_IN_YAML=(); COMPOSE_VARS=()
          [[ ${#RAW_SECRETS[@]} -gt 0 ]] && \
            mapfile -t SECRETS_IN_YAML < <(dedup "${RAW_SECRETS[@]}")
          [[ ${#RAW_VARS[@]} -gt 0 ]] && \
            mapfile -t VARS_IN_YAML   < <(dedup "${RAW_VARS[@]}")
          [[ ${#RAW_COMPOSE[@]} -gt 0 ]] && \
            mapfile -t COMPOSE_VARS   < <(dedup "${RAW_COMPOSE[@]}")

          # ── Fetch configured secrets and variables from GitHub API ───────────
          # Silent: no output or warnings when ORG_SCANNER_PAT is not available.
          # Sections below are only shown when the API call succeeds.
          CONFIGURED_SECRETS=()
          API_SECRETS_OK=false

          if repo_secrets=$(gh api "repos/${REPO}/actions/secrets" --paginate \
              --jq '.secrets[].name' 2>/dev/null); then
            while IFS= read -r name; do
              [[ -n "${name}" ]] && CONFIGURED_SECRETS+=("${name}")
            done < <(printf '%s\n' "${repo_secrets}" | sort -u)
            API_SECRETS_OK=true
          fi

          if org_secrets=$(gh api "orgs/${ORG}/actions/secrets" --paginate \
              --jq '.secrets[].name' 2>/dev/null); then
            while IFS= read -r name; do
              [[ -n "${name}" ]] && CONFIGURED_SECRETS+=("${name}")
            done < <(printf '%s\n' "${org_secrets}" | sort -u)
            API_SECRETS_OK=true
          fi

          if [[ ${#CONFIGURED_SECRETS[@]} -gt 0 ]]; then
            mapfile -t CONFIGURED_SECRETS < <(dedup "${CONFIGURED_SECRETS[@]}")
          fi

          CONFIGURED_VARS=()
          API_VARS_OK=false
          if vars_out=$(gh api "repos/${REPO}/actions/variables" --paginate \
              --jq '.variables[].name' 2>/dev/null); then
            while IFS= read -r name; do
              [[ -n "${name}" ]] && CONFIGURED_VARS+=("${name}")
            done < <(printf '%s\n' "${vars_out}" | sort -u)
            API_VARS_OK=true
          fi

          # ── Validate secrets (only when API is available) ───────────────────
          if [[ ${#SECRETS_IN_YAML[@]} -gt 0 && "${API_SECRETS_OK}" == "true" ]]; then
            section "Secrets — \${{ secrets.* }}"
            for secret in "${SECRETS_IN_YAML[@]}"; do
              if contains "${secret}" "${CONFIGURED_SECRETS[@]}"; then
                pass "${secret}"
              else
                fail "${secret} — not found in GitHub Secrets"
              fi
            done
          fi

          # ── Validate variables (only when API is available) ─────────────────
          if [[ ${#VARS_IN_YAML[@]} -gt 0 && "${API_VARS_OK}" == "true" ]]; then
            section "Variables — \${{ vars.* }}"
            for var in "${VARS_IN_YAML[@]}"; do
              if contains "${var}" "${CONFIGURED_VARS[@]}"; then
                pass "${var}"
              else
                fail "${var} — not found in GitHub Variables"
              fi
            done
          fi

          # ── Validate Docker Compose ${VAR} (only when API is available) ──────
          if [[ ${#COMPOSE_VARS[@]} -gt 0 \
            && ("${API_SECRETS_OK}" == "true" || "${API_VARS_OK}" == "true") ]]; then
            section "Docker Compose — \${VAR}"
            for var in "${COMPOSE_VARS[@]}"; do
              if contains "${var}" "${CONFIGURED_SECRETS[@]}" \
                || contains "${var}" "${CONFIGURED_VARS[@]}"; then
                pass "${var}"
              else
                fail "${var} — not found in GitHub Secrets or Variables"
              fi
            done
          fi

          # ── Cross-reference: .env_example vs all production configs ─────────
          if [[ ${#ENV_VARS[@]} -gt 0 && ${#PROD_YMLS[@]} -gt 0 ]]; then
            ALL_REFS=()
            for item in "${SECRETS_IN_YAML[@]}"; do ALL_REFS+=("${item}"); done
            for item in "${VARS_IN_YAML[@]}"; do ALL_REFS+=("${item}"); done
            for item in "${COMPOSE_VARS[@]}"; do ALL_REFS+=("${item}"); done

            if [[ ${#ALL_REFS[@]} -gt 0 ]]; then
              section ".env_example coverage"
              for var in "${ENV_VARS[@]}"; do
                if contains "${var}" "${ALL_REFS[@]}"; then
                  pass "${var} — referenced in production config"
                else
                  warn "${var} — in .env_example but not in production config"
                fi
              done
            fi
          fi

                    # ── Final result ────────────────────────────────────────────────────
          echo
          echo "${HR}"
          STATUS=0
          if [[ "${FAILED}" == "true" ]]; then
            echo "  ✗ FAILED — required configuration is missing"
            echo "${HR}"
            [[ "${FAIL_ON_MISSING}" == "true" ]] && STATUS=1
          else
            echo "  ✓ PASSED — all required configuration is present"
            echo "${HR}"
          fi

          # Make sure the tee subshell has flushed the file before we exit,
          # otherwise the notify step below can read a truncated report.
          wait "${TEE_PID}" 2>/dev/null || true
          exit "${STATUS}"

        

      - name: Send report to Zoho Cliq
        if: always()
        env:
          ZOHO_CLIQ_WEBHOOK_URL: ${{ secrets.ZOHO_CLIQ_WEBHOOK_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
          JOB_STATUS: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          REPORT_FILE="${RUNNER_TEMP}/validation-report.txt"
          if [[ -z "${ZOHO_CLIQ_WEBHOOK_URL:-}" ]]; then
            echo "ZOHO_CLIQ_WEBHOOK_URL secret not set — skipping Zoho notification."
            exit 0
          fi
          if [[ ! -f "${REPORT_FILE}" ]]; then
            echo "No report file found — skipping Zoho notification."
            exit 0
          fi
          ICON="✅"
          [[ "${JOB_STATUS}" != "success" ]] && ICON="❌"
          TITLE="${ICON} Configuration Validation — ${ENVIRONMENT} (${GITHUB_REPOSITORY})"
          # jq -Rs slurps the raw report file as one string and safely
          # JSON-encodes it (handles newlines/quotes) — no manual escaping.
          BODY=$(jq -Rs --arg title "${TITLE}" \
            '{ text: ($title + "\n```\n" + . + "\n```") }' "${REPORT_FILE}")
          curl -sS -X POST "${ZOHO_CLIQ_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${BODY}"
  validate-gcp-secret-manager:
    name: Configuration (GCP Secret Manager)
    if: inputs.gcp-secret-name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ inputs.gcp-project-id }}
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Compare .env_example against GCP Secret Manager
        id: validate-gcp
        env:
          ENV_EXAMPLE_PATH:    ${{ inputs.env-example-path }}
          GCP_PROJECT_ID:      ${{ inputs.gcp-project-id }}
          GCP_SECRET_NAME:     ${{ inputs.gcp-secret-name }}
          GCP_SECRET_VERSION:  ${{ inputs.gcp-secret-version }}
          GCP_SERVICE_ACCOUNT: ${{ inputs.gcp-service-account }}
          FAIL_ON_MISSING:     ${{ inputs.fail-on-missing }}
          ENVIRONMENT:         ${{ inputs.environment }}
        run: |
          set -euo pipefail

          REPORT_FILE="${RUNNER_TEMP}/gcp-secret-report.txt"
          HR='────────────────────────────────────────────────────────────────'
          TYPO_THRESHOLD=2   # max edit distance still considered "probably a typo"

          run_checks() {
            set -euo pipefail
            FAILED=false

            pass()    { echo "  ✓ $*"; }
            fail()    { echo "  ✗ $*"; FAILED=true; }
            warn()    { echo "  ⚠  $*"; }
            info()    { echo "  $*"; }
            section() { echo; echo "  ── $1"; }
            contains() {
              local target="$1"; shift
              local item
              for item; do [[ "${item}" == "${target}" ]] && return 0; done
              return 1
            }

            # Pure-bash edit distance — good enough for short env-var names.
            levenshtein() {
              local str1="$1" str2="$2"
              local len1=${#str1} len2=${#str2}
              local -A d
              local i j cost

              for ((i = 0; i <= len1; i++)); do d[$i,0]=$i; done
              for ((j = 0; j <= len2; j++)); do d[0,$j]=$j; done

              for ((i = 1; i <= len1; i++)); do
                for ((j = 1; j <= len2; j++)); do
                  [[ "${str1:i-1:1}" == "${str2:j-1:1}" ]] && cost=0 || cost=1
                  local del=$(( d[$((i-1)),$j] + 1 ))
                  local ins=$(( d[$i,$((j-1))] + 1 ))
                  local sub=$(( d[$((i-1)),$((j-1))] + cost ))
                  local min=$del
                  (( ins < min )) && min=$ins
                  (( sub < min )) && min=$sub
                  d[$i,$j]=$min
                done
              done
              echo "${d[$len1,$len2]}"
            }

            # Explains WHY a key looks missing/undocumented — case mismatch,
            # probable typo (with its closest match), or genuinely absent.
            diagnose() {
              local target="$1"; local pool_label="$2"; shift 2
              local -a pool=("$@")
              local candidate best="" best_dist=999 dist

              if [[ ${#pool[@]} -eq 0 ]]; then
                echo "no similar key found — looks like it was never added"
                return
              fi

              for candidate in "${pool[@]}"; do
                if [[ "${candidate,,}" == "${target,,}" ]]; then
                  echo "case mismatch — ${pool_label} has '${candidate}' instead"
                  return
                fi
              done

              for candidate in "${pool[@]}"; do
                dist=$(levenshtein "${target}" "${candidate}")
                if (( dist < best_dist )); then
                  best_dist=$dist
                  best="${candidate}"
                fi
              done

              if [[ "${best_dist}" -le "${TYPO_THRESHOLD}" ]]; then
                local plural="s"; [[ "${best_dist}" -eq 1 ]] && plural=""
                echo "possible typo — closest match in ${pool_label} is '${best}' (${best_dist} character${plural} different)"
              else
                echo "no similar key found — looks like it was never added"
              fi
            }

            echo "${HR}"
            info "GCP Secret Manager Validation — ${ENVIRONMENT}"
            info "Secret     : ${GCP_SECRET_NAME}"
            echo "${HR}"

            ENV_FILE=""
            for candidate in "${ENV_EXAMPLE_PATH}" ".env.example"; do
              [[ -f "${candidate}" ]] && { ENV_FILE="${candidate}"; break; }
            done

            ENV_VARS=()
            if [[ -n "${ENV_FILE}" ]]; then
              while IFS= read -r name; do
                [[ -n "${name}" ]] && ENV_VARS+=("${name}")
              done < <(
                grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "${ENV_FILE}" \
                  | sed 's/=.*//' | sort -u
              )
            fi

            if [[ ${#ENV_VARS[@]} -eq 0 ]]; then
              warn "No .env_example found — nothing to compare"
              return 0
            fi

            # Key names only — the value itself is never echoed or stored.
            SECRET_KEYS=()
            while IFS= read -r name; do
              [[ -n "${name}" ]] && SECRET_KEYS+=("${name}")
            done < <(
              gcloud secrets versions access "${GCP_SECRET_VERSION}" \
                  --secret="${GCP_SECRET_NAME}" \
                  --project="${GCP_PROJECT_ID}" \
                | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' \
                | sed 's/=.*//' \
                | sort -u
            )

            if [[ ${#SECRET_KEYS[@]} -eq 0 ]]; then
              fail "Could not read any KEY= lines from '${GCP_SECRET_NAME}'"
              section "Possible causes"
              info "• The secret name '${GCP_SECRET_NAME}' doesn't exist in project '${GCP_PROJECT_ID}' — check for a typo in the gcp-secret-name input"
              info "• '${GCP_SERVICE_ACCOUNT:-the service account}' lacks Secret Manager Secret Accessor on this secret"
              info "• The secret exists but every version is disabled or destroyed"
              info "• The secret's content isn't in KEY=VALUE line format, or is empty"
              echo; echo "${HR}"
              [[ "${FAIL_ON_MISSING}" == "true" ]] && return 1
              return 0
            fi

            MISSING_KEYS=()
            for var in "${ENV_VARS[@]}"; do
              contains "${var}" "${SECRET_KEYS[@]}" || MISSING_KEYS+=("${var}")
            done

            UNDOCUMENTED_KEYS=()
            for var in "${SECRET_KEYS[@]}"; do
              contains "${var}" "${ENV_VARS[@]}" || UNDOCUMENTED_KEYS+=("${var}")
            done

            section "GCP Secret Manager coverage (${GCP_SECRET_NAME})"
            for var in "${ENV_VARS[@]}"; do
              if contains "${var}" "${SECRET_KEYS[@]}"; then
                pass "${var} — present in GCP secret"
              else
                reason=$(diagnose "${var}" "the secret" "${UNDOCUMENTED_KEYS[@]}")
                fail "${var} — in .env_example but MISSING from GCP secret (${reason})"
              fi
            done

            section "Undocumented keys (in secret, not in .env_example)"
            if [[ ${#UNDOCUMENTED_KEYS[@]} -eq 0 ]]; then
              info "None — every secret key is documented"
            else
              for var in "${UNDOCUMENTED_KEYS[@]}"; do
                reason=$(diagnose "${var}" ".env_example" "${MISSING_KEYS[@]}")
                warn "${var} — in GCP secret but not in .env_example (${reason})"
              done
            fi

            echo; echo "${HR}"
            if [[ "${FAILED}" == "true" ]]; then
              echo "  ✗ FAILED — .env_example references keys missing from GCP Secret Manager"
              echo "${HR}"
              [[ "${FAIL_ON_MISSING}" == "true" ]] && return 1
              return 0
            else
              echo "  ✓ PASSED — every .env_example key exists in GCP Secret Manager"
              echo "${HR}"
              return 0
            fi
          }

          set +e
          OUTPUT="$(run_checks)"
          STATUS=$?
          set -e

          echo "${OUTPUT}"
          printf '%s\n' "${OUTPUT}" > "${REPORT_FILE}"
          exit "${STATUS}"


      - name: Send report to Zoho Cliq
        if: always()
        env:
          CLIQ_WEBHOOK_TOKEN: ${{ secrets.CLIQ_WEBHOOK_URL }}
          CLIQ_BOT_NAME: "secretcheck"
          ENVIRONMENT: ${{ inputs.environment }}
          JOB_STATUS: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          REPORT_FILE="${RUNNER_TEMP}/validation-report.txt"
          if [[ -z "${CLIQ_WEBHOOK_TOKEN:-}" ]]; then
            echo "CLIQ_WEBHOOK_URL secret not set — skipping Zoho notification."
            exit 0
          fi
          if [[ ! -f "${REPORT_FILE}" ]]; then
            echo "No report file found — skipping Zoho notification."
            exit 0
          fi
          WEBHOOK_URL="https://cliq.zoho.com/api/v2/bots/${CLIQ_BOT_NAME}/incoming?zapikey=${CLIQ_WEBHOOK_TOKEN}"
          ICON="✅"
          [[ "${JOB_STATUS}" != "success" ]] && ICON="❌"
          TITLE="${ICON} Configuration Validation — ${ENVIRONMENT} (${GITHUB_REPOSITORY})"
          BODY=$(jq -Rs --arg title "${TITLE}" \
            '{ text: ($title + "\n```\n" + . + "\n```") }' "${REPORT_FILE}")
          curl -sS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${BODY}"
  # ─────────────────────────────────────────────────────────────────────────
  # Add future validation jobs here — they run in parallel with the above.
  # Each job should be independent and focused on a single concern.
  #
  # Examples:
  #
  #   yaml-validation:
  #     name: YAML Syntax
  #     runs-on: ubuntu-latest
  #     permissions:
  #       contents: read
  #     steps:
  #       - uses: actions/checkout@v4
  #       - run: yamllint .
  #
  #   security-check:
  #     name: Security
  #     runs-on: ubuntu-latest
  #     ...
  #
  #   dependency-audit:
  #     name: Dependency Audit
  #     runs-on: ubuntu-latest
  #     ...
  # ─────────────────────────────────────────────────────────────────────────